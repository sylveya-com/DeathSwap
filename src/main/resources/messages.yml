# ============================================
#                 MiniMessage
# ============================================
# Format documentation: https://docs.advntr.dev/minimessage/

# Prefix is added to messages using %prefix%.
prefix: "<gold>[DeathSwap]</gold> "

config-reloaded: "%prefix%<green>Configuration reloaded successfully."
lobby-set: "%prefix%<green>Lobby location has been set."

usage: "%prefix%<red>Usage: /deathswap <join|leave|start|stop|reload|setlobby>"
player-only: "<red>Only players can use this command."
no-permission: "<red>You don't have permission to use this command."
lobby-not-set: "%prefix%<red>Lobby is not set. Use /deathswap setlobby first."

joined: "%prefix%<green>You joined the game."
already-joined: "%prefix%<red>You are already in the game."
already-queue: "%prefix%<yellow>You are already waiting for a game."
not-joined: "%prefix%<red>You are not in the game."
left: "%prefix%<gray>You left the game."

not-enough-players: "%prefix%<red>Not enough players. At least 2 players are required."
worlds-busy: "%prefix%<red>No free world slots. Please try again in a moment."
starting: "<gray>Game starting in</gray> <white><seconds></white><gray>s..."
needs-players: "<gray>Waiting for players</gray> <white>(<players>/<required>)"
world-preparing: "%prefix%<gray><italic>Preparing the world..."
game-started: "%prefix%<green>The game has started!"
already-running: "<red>A game is already running."

countdown: "<gold><bold><seconds>"
swap-message: "%prefix%<gray><italic>Swapping positions..."
eliminated: "%prefix%<red>You have been eliminated!"
player-eliminated: "%prefix%<red>Player <white><player></white> <red>has been eliminated."
deaths-left: "%prefix%<gray>Deaths remaining:</gray> <red><deaths>"
winner: "%prefix%<green>The winner is <gold><player>"
time-up: "%prefix%<yellow>Time is up! The match has ended."

game-stopped: "<red>The game has been stopped."
not-running: "%prefix%<red>No game is currently running."

scoreboard-title: "<gold>Death Count"
scoreboard-entry: "<white><player>"
