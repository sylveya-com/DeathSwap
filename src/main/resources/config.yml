# ============================================
#                 Game Rules
# ============================================
# Configure the core DeathSwap match rules.
#
# min-players-to-start: Players needed for the countdown to begin.
# start-delay: Countdown in seconds before the match starts.
# min-players-fast-start: Player count at which the timer shrinks.
# fast-start-delay: Shortened countdown in seconds.
#
# swap-interval: Seconds between position swaps.
# countdown-seconds: Warning countdown before each swap.
# max-deaths: Deaths before elimination.
# max-match-time: Max match length in minutes, 0 = unlimited.
# pvp-enabled: If enabled, players can damage each other.
# ============================================

game:
  min-players-to-start: 2
  start-delay: 120
  min-players-fast-start: 4
  fast-start-delay: 20

  swap-interval: 300
  countdown-seconds: 5
  max-deaths: 5
  max-match-time: 0
  pvp-enabled: false


# ============================================
#                 Display
# ============================================
# Configure HUD elements shown during a match.
#
# scoreboard: If enabled, shows the in-match sidebar scoreboard.
# actionbar: If enabled, shows HUD countdowns (lobby start + swap warning).
# ============================================

display:
  scoreboard: true
  actionbar: true


# ============================================
#                Visibility
# ============================================
# Configure isolation between matches.
#
# isolate-chat: Keep chat between players in the same match.
# isolate-deaths: Keep death messages between players in the same match.
# isolate-achievements: Keep advancement messages between players in
#                       the same match (Paper only).
# match-players-in-tab: Hide players in a match from the tab list of
#                       players outside that match (requires PacketEvents).
# ============================================

hide:
  isolate-chat: true
  isolate-deaths: true
  isolate-achievements: true
  match-players-in-tab: false


# ============================================
#                  Sounds
# ============================================
# Sound events played during the match.
# ============================================

sounds:
  countdown-tick: entity.note.pling
  countdown-go: entity.experience_orb.pickup
  swap: entity.enderman.teleport
  win: ui.toast.challenge_complete


# ============================================
#                  Worlds
# ============================================
# Configure game world generation.
#
# count: Number of persistent reusable worlds
#        (each = one concurrent match).
# generate-on-start: If enabled, generates a brand-new world when the
#                    game starts instead of reusing a pool
#                    (ignores count, no limit on worlds).
# pre-generate-radius: Pre-generate spawn chunks around the spawn,
#                      0 = off.
# spawn-radius: Per-world random respawn radius around spawn,
#               0 = exact spawn.
# border: World border size in blocks (centered on spawn), 0 = disabled.
# name-prefix: Prefix for generated world names (e.g. "ds_0").
# generate-dimensions: If enabled, every game world gets its own nether
#                      and end (false = share server defaults).
# ============================================

worlds:
  count: 5
  generate-on-start: true
  pre-generate-radius: 7
  spawn-radius: 100
  border: 3000
  name-prefix: ds
  generate-dimensions: true
