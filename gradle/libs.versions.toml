[versions]

# plugins & build tools
shadow = "9.0.0"

# compile time processing
lombok = "1.18.42"

# platform api
spigot = "26.3-R0.1-SNAPSHOT"

# dependencies
packetevents = "2.14.0"
placeholderapi = "2.12.3"
faststats = "0.30.2"
adventure = "5.2.0"
configura = "2.1.0"
strata = "2.0.0"

# testing
junit = "5.11.4"
junit-platform = "1.11.4"

[libraries]

# compile time processing
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }

# platform api
spigot-api = { group = "org.spigotmc", name = "spigot-api", version.ref = "spigot" }

# core dependencies
placeholderapi = { group = "me.clip", name = "placeholderapi", version.ref = "placeholderapi" }
packetevents-spigot = { group = "com.github.retrooper", name = "packetevents-spigot", version.ref = "packetevents" }
faststats-bukkit = { group = "dev.faststats.metrics", name = "bukkit", version.ref = "faststats" }

adventure-api = { group = "net.kyori", name = "adventure-api", version.ref = "adventure" }
adventure-text-serializer-legacy = { group = "net.kyori", name = "adventure-text-serializer-legacy", version.ref = "adventure" }
adventure-text-minimessage = { group = "net.kyori", name = "adventure-text-minimessage", version.ref = "adventure" }

configura = { group = "me.whereareiam", name = "configura", version.ref = "configura" }
configura-feature-comment = { group = "me.whereareiam.configura.feature", name = "comment", version.ref = "configura" }
strata = { group = "me.whereareiam", name = "strata", version.ref = "strata" }
strata-adapter-configura = { group = "me.whereareiam", name = "strata-adapter-configura", version.ref = "strata" }

# testing
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit-platform" }

[bundles]

adventure = ["adventure-api", "adventure-text-serializer-legacy", "adventure-text-minimessage"]
configura = ["configura", "configura-feature-comment"]
strata = ["strata", "strata-adapter-configura"]

[plugins]

shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
